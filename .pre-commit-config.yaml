# Installed by `make setup`. Tool versions come from uv.lock, so the hooks,
# `make check` and CI all run the same versions.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
      - id: pyright
        name: pyright (on push)
        entry: uv run python scripts/run_pyright.py
        language: system
        pass_filenames: false
        types_or: [python, pyi]
        stages: [pre-push]
