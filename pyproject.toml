[project]
name = "geospatial-ai-harness"
version = "0.0.0"
description = "AI harness for geospatial workflows"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit",
    "pyright",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 80
target-version = "py312"
# Markdown is excluded: the formatter would rewrite the deliberately bad
# examples in docs/CODING_GUIDELINES.md.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors. E701 bans one-line `if x: return`.
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import order
    "N",    # naming
    "D",    # docstrings
    "UP",   # modern syntax
    "B",    # likely bugs
    "ANN",  # type annotations on every function
    "BLE",  # no blind `except`
    "PTH",  # pathlib over os.path
    "T20",  # no print
    "ERA",  # no commented-out code
]
ignore = [
    "D100",  # module docstrings are optional
    "D104",  # package docstrings are optional
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["harness", "geo_tools", "serving"]
